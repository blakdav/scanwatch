services:
  ScanWatch:
    image: ghcr.io/blakdav/scanwatch:latest
    container_name: ScanWatch
    restart: unless-stopped
    environment:
      # Set in .env (copy .env.example); not committed.
      SCANNER_IP: ${SCANNER_IP:?set SCANNER_IP in .env}
      PUID: 1000
      PGID: 1000
      TZ: America/Los_Angeles
    volumes:
      # Point this at the Paperless consume directory
      - /opt/docker/paperless/consume:/out
      - /opt/docker/scanwatch/state:/state
    ports:
      - "8080:8080"
